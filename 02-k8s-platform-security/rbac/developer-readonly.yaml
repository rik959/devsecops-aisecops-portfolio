# Least-privilege RBAC: developers can read workloads and logs in their
# namespace, but cannot read Secrets, exec into pods, or change anything.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-readonly
  namespace: ai-gateway
rules:
  - apiGroups: ["", "apps", "batch", "autoscaling", "networking.k8s.io"]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - events
      - deployments
      - replicasets
      - statefulsets
      - jobs
      - cronjobs
      - horizontalpodautoscalers
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  # Deliberately absent: secrets, pods/exec, pods/portforward, any write verb.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developers-readonly
  namespace: ai-gateway
subjects:
  - kind: Group
    name: ai-gateway-developers # mapped from the IdP (Keycloak/Entra/Okta) via EKS access entries or OIDC
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: developer-readonly
  apiGroup: rbac.authorization.k8s.io

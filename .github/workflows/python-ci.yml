name: python-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - 03-llm-security-gateway
          - 04-mlops-pipeline
          - 05-data-pipeline
          - 07-vuln-management-automation
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements*.txt
      - name: Install
        run: |
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install -r requirements.txt; fi
          pip install ruff==0.17.6
      - name: Lint
        run: ruff check .   # rules in /ruff.toml (incl. bandit-style S rules)
      - name: Test
        run: pytest -q

      # AISecOps quality gate: injection detector must keep precision/recall >= 0.9
      - name: Prompt-injection eval gate
        if: matrix.project == '03-llm-security-gateway'
        run: python evals/run_evals.py --min-precision 0.9 --min-recall 0.9

      # MLOps quality gate: model must reach PR-AUC >= 0.5 or the build fails
      - name: Train + model quality gate
        if: matrix.project == '04-mlops-pipeline'
        run: python -m src.train --out artifacts --min-pr-auc 0.5

      - name: Upload model card
        if: matrix.project == '04-mlops-pipeline'
        uses: actions/upload-artifact@v4
        with:
          name: model-card
          path: 04-mlops-pipeline/artifacts/model_card.json
